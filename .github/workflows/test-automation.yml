name: QA Automation CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  api-tests:
    name: API Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      
      - run: npx playwright install --with-deps chromium  # <-- ADD THIS

      - run: npm run test:api

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: reports/

  ui-tests:
    name: UI Regression Tests
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # <-- CHANGED from '20'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-screenshots
          path: reports/screenshot-*.png

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: reports/

  generate-report:
    name: Generate & Publish Report
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    permissions:          # <-- ADD THIS BLOCK
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # <-- CHANGED from '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: api-test-results
          path: reports/api/

      - uses: actions/download-artifact@v4
        with:
          name: ui-test-results
          path: reports/ui/

      - name: Merge reports
        run: |
          mkdir -p reports
          cp reports/api/*.json reports/ 2>/dev/null || true
          cp reports/ui/*.json reports/ 2>/dev/null || true
          ls -la reports/

      - name: Generate HTML report
        run: npm run report

      - name: Verify report exists
        run: |
          ls -la reports/html/
          test -f reports/html/index.html && echo "✅ index.html exists" || echo "❌ index.html missing"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-test-report
          path: reports/html/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/html
          force_orphan: true